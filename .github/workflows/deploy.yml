name: Deploy

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Pricing job]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refuse to deploy sample prices
        run: |
          if grep -q '"source":"sample"' public/prices/uksouth/latest.json; then
            echo "::error::public/prices still holds sample data. Run the Pricing job first."
            exit 1
          fi
      - run: npm test
      - run: npm run build
      - name: Deploy to Azure Static Web Apps
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
