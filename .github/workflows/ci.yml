name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - name: Unit and golden tests
        run: npm test
      - run: npm run build
      - name: Install Chromium for accessibility tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end and axe accessibility tests
        run: npm run test:e2e
