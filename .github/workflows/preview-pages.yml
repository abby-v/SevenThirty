name: Preview on GitHub Pages

# Builds the site and publishes it to GitHub Pages so you can click around it.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Until the pricing job has run, the preview uses the labelled sample prices.

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
  # Republish after a successful price refresh (commits made by a workflow don't trigger push).
  workflow_run:
    workflows: [Pricing job, Lite prices]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Add SevenThirty Lite at /lite
        run: cp -r lite/site dist/lite
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
