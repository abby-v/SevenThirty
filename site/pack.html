<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>Client pack · SevenThirty</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Paper document: deliberately light-only, because it is printed and sent to clients. */
:root{
  --desk:#E6EAF0; --paper:#FFFFFF; --ink:#141B26; --muted:#556172; --rule:#D3DAE3; --soft:#F2F5F8;
  --accent:#2347B8; --accent-soft:#E6ECFB; --standing:#8A5300; --usage:#126B5C; --good:#126B5C; --warn-bg:#FFF3D9; --warn-ink:#6A4100;
  --sans:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--sans);font-size:10.5pt;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.num,td.num,th.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding:10px 16px}
.bar p{margin:0;font-size:.85rem;opacity:.85;max-width:62ch}
.bar .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:6px;padding:8px 14px;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer;text-decoration:none}
.btn.primary{background:#fff;color:var(--ink);border-color:#fff}

.doc{max-width:210mm;margin:24px auto 60px;background:var(--paper);box-shadow:0 1px 3px rgba(20,27,38,.12),0 8px 30px rgba(20,27,38,.08);padding:18mm 16mm}
@media (max-width:820px){.doc{margin:0;padding:24px 16px;box-shadow:none}}

h1,h2,h3{font-family:var(--sans);text-wrap:balance;margin:0}
h1{font-size:26pt;font-weight:800;letter-spacing:-.02em;line-height:1.1}
h2{font-size:15pt;font-weight:800;letter-spacing:-.01em;margin:0 0 4mm;padding-bottom:2mm;border-bottom:2px solid var(--ink)}
h3{font-size:11pt;font-weight:700;margin:5mm 0 2mm}
p{margin:0 0 3mm;max-width:75ch}
section{margin-top:10mm}
.lead{font-size:11.5pt}
.muted{color:var(--muted)}

/* Cover */
.cover{min-height:240mm;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:8px;font-size:9pt;color:var(--muted)}
.mark{font-family:var(--mono);font-weight:600;font-size:8pt;background:var(--ink);color:#fff;padding:3px 5px;border-radius:3px}
.cover .titles{margin-top:40mm}
.cover .for{font-size:13pt;color:var(--muted);margin-top:4mm}
.cover .figure{margin-top:18mm;display:flex;flex-wrap:wrap;gap:8mm 14mm}
.cover .figure div span{display:block;font-size:9pt;color:var(--muted)}
.cover .figure b{font-family:var(--mono);font-weight:500;font-size:22pt;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.facts{margin-top:auto;display:grid;grid-template-columns:auto 1fr;gap:1.5mm 8mm;font-size:9.5pt;border-top:1px solid var(--rule);padding-top:5mm}
.facts dt{color:var(--muted)}
.facts dd{margin:0}

/* Figures and tables */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm;margin:2mm 0 5mm}
@media (max-width:600px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--soft);border-radius:2mm;padding:3mm}
.kpi span{display:block;font-size:8.5pt;color:var(--muted)}
.kpi b{font-family:var(--mono);font-weight:500;font-size:13pt;font-variant-numeric:tabular-nums}
.split{display:flex;height:3mm;border-radius:1.5mm;overflow:hidden;background:var(--rule);margin:1mm 0 2mm}
.split .s{background:var(--standing)} .split .u{background:var(--usage)}
.legend{display:flex;gap:6mm;font-size:9pt}
.sw{display:inline-block;width:2.5mm;height:2.5mm;border-radius:.6mm;margin-right:1.5mm;vertical-align:middle}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:9.5pt;margin:2mm 0 4mm}
th,td{padding:1.6mm 2mm;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
th{font-size:8.5pt;font-weight:600;color:var(--muted);border-bottom:1.5px solid var(--ink)}
tr.total td{font-weight:700;border-top:1.5px solid var(--ink);border-bottom:0}
tr.sub td{background:var(--soft);font-weight:600}
td.best{font-weight:700;color:var(--good)}
td.cur{box-shadow:inset 0 -2px 0 var(--accent)}
table.commit{table-layout:fixed}
table.commit th:first-child,table.commit td:first-child{width:28%}
table.commit th,table.commit td{padding:1.6mm 1.4mm}
.kind{font-size:7pt;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kind.standing{color:var(--standing)} .kind.usage{color:var(--usage)}
.calc{font-family:var(--mono);font-size:8pt;color:var(--muted)}
.note{background:var(--warn-bg);color:var(--warn-ink);padding:2.5mm 3mm;border-radius:1.5mm;font-size:9pt}
ul.list{margin:0 0 3mm;padding-left:5mm}
ul.list li{margin-bottom:1mm}
.chart svg{display:block;width:100%;height:auto}
.disclaimer{font-size:8.5pt;color:var(--muted);border-top:1px solid var(--rule);padding-top:3mm;margin-top:8mm}
.empty{padding:20mm 0;text-align:center}

@page{size:A4;margin:14mm 14mm 16mm}
@media print{
  body{background:#fff;font-size:10pt}
  .bar{display:none}
  .doc{margin:0;padding:0;max-width:none;box-shadow:none}
  .cover{min-height:255mm;break-after:page}
  .pagebreak{break-before:page}
  section{break-inside:auto}
  h2,h3{break-after:avoid}
  tr,.kpi,.chart,.note{break-inside:avoid}
  #commitments,.kpis{break-inside:avoid}
  thead{display:table-header-group}
}
</style>
</head>
<body>
<div class="bar" role="region" aria-label="Pack actions">
  <p>This is your client pack. Choose <b>Print or save as PDF</b>, then pick “Save as PDF” as the printer.</p>
  <div class="acts">
    <button class="btn primary" type="button" id="printBtn">Print or save as PDF</button>
    <a class="btn" href="./">Back to the estimate</a>
  </div>
</div>
<main class="doc" id="doc"><p class="empty muted">Preparing the pack…</p></main>
<script type="module" src="js/pack.js"></script>
</body>
</html>
