# Azure DevOps alternative to the GitHub Actions workflows: daily pricing job,
# tests, build and deploy to Azure Static Web Apps.
#
# Variables (pipeline library or secret variables):
#   SWA_DEPLOYMENT_TOKEN  Static Web App deployment token (terraform output)

trigger:
  branches:
    include: [main]

schedules:
  - cron: '17 5 * * *'
    displayName: Daily GBP price snapshot
    branches:
      include: [main]
    always: true

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    persistCredentials: true
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
  - script: npm ci
    displayName: Install
  - script: npm run prices
    displayName: Fetch, normalise and validate GBP prices
    condition: eq(variables['Build.Reason'], 'Schedule')
  - script: npm run lint && npx tsc -b && npm test
    displayName: Lint, type-check and golden tests
  - script: |
      if grep -q '"source":"sample"' public/prices/uksouth/latest.json; then
        echo "##vso[task.logissue type=error]Sample prices present. Run the pricing step first."; exit 1
      fi
    displayName: Refuse to deploy sample prices
  - script: |
      git config user.name "seventhirty-pricing"
      git config user.email "seventhirty-pricing@noreply"
      git add public/prices
      git diff --cached --quiet || (git commit -m "Price snapshot $(date -u +%Y-%m-%d) [skip ci]" && git push origin HEAD:main)
    displayName: Commit snapshot
    condition: eq(variables['Build.Reason'], 'Schedule')
  - script: npm run build
    displayName: Build
  - task: AzureStaticWebApp@0
    displayName: Deploy to Azure Static Web Apps
    inputs:
      app_location: dist
      skip_app_build: true
      skip_api_build: true
      azure_static_web_apps_api_token: $(SWA_DEPLOYMENT_TOKEN)
